---
title: StreamForge
description: >-
  Selective Kafka replication with destination-specific filtering,
  transformation, and redaction.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
url: "https://rahulbsw.github.io"
baseurl: "/streamforge"

# Prometheus, Go templates, and Helm examples contain Liquid-like braces.
render_with_liquid: false

relative_links:
  enabled: true
  collections: true

# The Pages source also contains engineering records. Only the curated product
# documents remain publishable; design history, benchmark evidence, and launch
# production material stay in the repository but outside the generated site.
exclude:
  - "*.sh"
  - "archive"
  - "benchmarks"
  - "development"
  - "marketing"
  - "superpowers"
  - "CONFIG_SCHEMA.json"
  - Gemfile
  - Gemfile.lock
  - "ADVANCED_FILTERS.md"
  - "AT_LEAST_ONCE_AND_CACHE_BACKENDS.md"
  - "DSL_FEATURES.md"
  - "DSL_SIMPLIFICATION_INVENTORY.md"
  - "DSL_SPEC.md"
  - "DSL_V2_FUNCTION_SYNTAX.md"
  - "ENVELOPE_FEATURE_DESIGN.md"
  - "ENVELOPE_MIGRATION_GUIDE.md"
  - "ERROR_HANDLING.md"
  - "HASH_AND_CACHE.md"
  - "IMPLEMENTATION_NOTES.md"
  - "IMPLEMENTATION_STATUS.md"
  - "PARSER_REFACTOR_PLAN.md"
  - "PERFORMANCE_TESTING.md"
  - "PERFORMANCE_TUNING_RESULTS.md"
  - "QUICK_REFERENCE.md"
  - "TEST_COVERAGE.md"
  - "TYPED_ENVELOPE_DESIGN.md"

color_scheme: streamforge
logo: "/assets/images/streamforge-mark.svg"
favicon_ico: "/assets/images/streamforge-favicon.png"

nav_sort: case_insensitive

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "USAGE.md"
    values:
      has_children: true
  - scope:
      path: "EXAMPLES.md"
    values:
      parent: "Usage Guide"
      nav_order: 1
  - scope:
      path: "ADVANCED_DSL_GUIDE.md"
    values:
      parent: "Usage Guide"
      nav_order: 2
  - scope:
      path: "YAML_CONFIGURATION.md"
    values:
      parent: "Usage Guide"
      nav_order: 3
  - scope:
      path: "AGGREGATIONS.md"
    values:
      parent: "Usage Guide"
      nav_order: 4
  - scope:
      path: "DELIVERY_GUARANTEES.md"
    values:
      parent: "Usage Guide"
      nav_order: 5
  - scope:
      path: "DEPLOYMENT.md"
    values:
      has_children: true
  - scope:
      path: "OPERATIONS.md"
    values:
      has_children: true

search_enabled: true
search_tokenizer_separator: /[\s/]+/
heading_anchors: true

callouts_level: quiet
callouts:
  highlight:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  new:
    title: New
    color: green
  warning:
    title: Warning
    color: red

aux_links:
  "GitHub":
    - "https://github.com/rahulbsw/streamforge"
  "Releases":
    - "https://github.com/rahulbsw/streamforge/releases"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/rahulbsw/streamforge"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"
