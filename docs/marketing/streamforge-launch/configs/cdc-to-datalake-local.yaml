# Local recording config for Demo 4: CDC to data lake pipeline.
# This mirrors the production CDC example but points at localhost so the
# recording can run against the repo's local Redpanda stack.

appid: "cdc-to-datalake-demo"
bootstrap: "localhost:9092"
input: "dbserver.inventory.orders"
offset: "earliest"
threads: 4

performance:
  fetch_min_bytes: 2048
  fetch_max_wait_ms: 200
  batch_size: 1000
  linger_ms: 100
  compression: "zstd"

commit_strategy:
  manual_commit: true
  commit_mode: async
  commit_interval_ms: 10000

retry:
  max_attempts: 3
  initial_delay_ms: 100
  max_delay_ms: 30000
  multiplier: 2.0
  jitter: 0.1

dlq:
  enabled: true
  topic: "cdc-datalake-dlq"
  include_original_headers: true
  include_stack_trace: false
  max_dlq_retries: 3

routing:
  routing_type: "filter"
  destinations:
    - output: "datalake-orders"
      filter: "OR:/payload/op,==,c:/payload/op,==,u"
      transform: "/payload/after"
      key_transform: "/payload/after/id"
      partitioning: "field"
      partition_field: "/payload/after/customer_id"
      headers:
        x-pipeline: "cdc-to-datalake-demo"
        x-source: "inventory.orders"

    - output: "datalake-orders-deleted"
      filter: "/payload/op,==,d"
      transform: "CONSTRUCT:id=/payload/before/id:deleted_at=/payload/ts_ms"
      key_transform: "/payload/before/id"
      headers:
        x-pipeline: "cdc-to-datalake-demo"
        x-operation: "delete"

    - output: "datalake-schema-changes"
      filter: "/payload/op,==,s"
      transform: "/payload"
      headers:
        x-pipeline: "cdc-to-datalake-demo"
        x-operation: "schema-change"

observability:
  metrics_enabled: true
  metrics_port: 8080
  metrics_path: "/metrics"
  lag_monitoring_enabled: true
  lag_monitoring_interval_secs: 30
