name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  validate-release:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v: ${RELEASE_TAG}" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          root_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "streamforge") | .version')"
          model_version="$(cargo metadata --manifest-path crates/streamforge-config-model/Cargo.toml \
            --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "streamforge-config-model") | .version')"
          operator_version="$(cargo metadata --manifest-path operator/Cargo.toml \
            --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "streamforge-operator") | .version')"
          ui_version="$(jq -r '.version' ui/package.json)"
          chart_version="$(awk '$1 == "version:" {print $2}' helm/streamforge-operator/Chart.yaml)"
          chart_app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' helm/streamforge-operator/Chart.yaml)"
          for component_version in \
            "${root_version}" \
            "${model_version}" \
            "${operator_version}" \
            "${ui_version}" \
            "${chart_version}" \
            "${chart_app_version}"; do
            if [[ "${component_version}" != "${version}" ]]; then
              echo "Component version ${component_version} does not match ${version}" >&2
              exit 1
            fi
          done

          gh release view "${RELEASE_TAG}" >/dev/null
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}

  release-smoke-tests:
    name: Validate release packaging
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Test Docker and Podman quickstart command paths
        run: scripts/tests/quickstart_test.sh

      - name: Preflight crates.io packages
        run: cargo package --locked --no-verify

      - name: Validate secure Helm render paths
        shell: bash
        run: |
          set -euo pipefail
          helm lint helm/streamforge-operator
          helm template streamforge helm/streamforge-operator >/dev/null
          helm template streamforge helm/streamforge-operator \
            --set ui.enabled=true \
            --set ui.auth.existingSecret=streamforge-ui-auth >/dev/null
          helm template streamforge helm/streamforge-operator \
            --set ui.enabled=true \
            --set ui.auth.developmentMode=true >/dev/null
          if helm template streamforge helm/streamforge-operator \
            --set ui.enabled=true >/dev/null 2>&1; then
            echo "UI rendered without a production Secret or development mode" >&2
            exit 1
          fi

  publish-crate:
    name: Publish crate
    needs: [validate-release, release-smoke-tests, container-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libcurl4-openssl-dev \
            libsasl2-dev \
            libssl-dev \
            libzstd-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish StreamForge crate
        shell: bash
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          if cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}" 2>"${output_file}"; then
            exit 0
          fi
          cat "${output_file}" >&2
          if grep -Eq 'already exists|already uploaded' "${output_file}"; then
            echo "Version is already published; continuing."
            exit 0
          fi
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-release-binaries:
    name: Build binaries (${{ matrix.asset }})
    needs: [validate-release, release-smoke-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: streamforge-linux-amd64
            artifact: release-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: streamforge-linux-arm64
            artifact: release-linux-arm64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: streamforge-macos-arm64
            artifact: release-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libcurl4-openssl-dev \
            libsasl2-dev \
            libssl-dev \
            libzstd-dev \
            pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cyrus-sasl openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix cyrus-sasl)/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Build both release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" --bins

      - name: Smoke test both release binaries
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          "${bin_dir}/streamforge" --help >/dev/null
          "${bin_dir}/streamforge-validate" \
            examples/redpanda/selective-replication.yaml >/dev/null
          "${bin_dir}/streamforge-validate" \
            tests/fixtures/wasm/release-smoke.yaml >/dev/null

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp "target/${{ matrix.target }}/release/streamforge" dist/bin/
          cp "target/${{ matrix.target }}/release/streamforge-validate" dist/bin/
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            strip dist/bin/streamforge dist/bin/streamforge-validate
          fi
          tar -C dist/bin -czf "dist/${{ matrix.asset }}.tar.gz" \
            streamforge streamforge-validate

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  container-preflight:
    name: Preflight ${{ matrix.component }} image
    needs: [validate-release, release-smoke-tests, build-release-binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: engine
            dockerfile: Dockerfile.release
          - component: operator
            dockerfile: operator/Dockerfile
          - component: ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download engine binary
        if: matrix.component == 'engine'
        uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: release-input/amd64

      - name: Build image without publishing
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "streamforge-${{ matrix.component }}:preflight" \
            .

      - name: Smoke test image entrypoint
        shell: bash
        run: |
          case "${{ matrix.component }}" in
            ui)
              docker run --rm \
                --entrypoint /usr/local/bin/streamforge-validate \
                streamforge-ui:preflight --help
              ;;
            *)
              docker run --rm "streamforge-${{ matrix.component }}:preflight" --help
              ;;
          esac

  publish-binary-assets:
    name: Publish checksummed binaries and SBOMs
    needs: [validate-release, build-release-binaries, container-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate checksums and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-input -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
          (
            cd release-assets
            sha256sum ./*.tar.gz > SHA256SUMS
            for archive in ./*.tar.gz; do
              syft scan "${archive}" \
                --output "spdx-json=${archive%.tar.gz}.spdx.json"
            done
          )

      - name: Smoke test downloaded binaries
        run: |
          release-input/release-linux-amd64/bin/streamforge --help >/dev/null
          release-input/release-linux-amd64/bin/streamforge-validate \
            examples/redpanda/selective-replication.yaml >/dev/null

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*.tar.gz

      - name: Upload binary assets
        shell: bash
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-engine-image:
    name: Publish engine image
    needs: [validate-release, build-release-binaries, container-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64
          path: release-input/amd64

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: release-linux-arm64
          path: release-input/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and publish engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ needs.validate-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-component-images:
    name: Publish ${{ matrix.component }} image
    needs: [validate-release, release-smoke-tests, build-release-binaries, container-preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: operator
            context: .
            dockerfile: operator/Dockerfile
            suffix: -operator
          - component: UI
            context: .
            dockerfile: ui/Dockerfile
            suffix: -ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}${{ matrix.suffix }}:${{ needs.validate-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm-chart:
    name: Publish OCI Helm chart
    needs:
      - validate-release
      - publish-engine-image
      - publish-component-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint and package chart
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-release.outputs.version }}"
          helm lint helm/streamforge-operator
          helm package helm/streamforge-operator \
            --version "${version}" \
            --app-version "${version}" \
            --destination release-chart
          sha256sum release-chart/*.tgz > release-chart/SHA256SUMS-helm

      - name: Create Kubernetes smoke cluster
        uses: helm/kind-action@v1.12.0

      - name: Load published images into kind
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-release.outputs.version }}"
          operator_image="ghcr.io/${{ github.repository }}-operator:${version}"
          printf '%s' "${GH_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker pull "${operator_image}"
          cluster_name="$(kind get clusters | head -n 1)"
          kind load docker-image "${operator_image}" --name "${cluster_name}"
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || github.token }}

      - name: Install chart and verify operator rollout
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-release.outputs.version }}"
          chart="$(find release-chart -maxdepth 1 -name '*.tgz' -print -quit)"
          helm install streamforge "${chart}" \
            --namespace streamforge-system \
            --create-namespace \
            --set "operator.image.repository=ghcr.io/${{ github.repository }}-operator" \
            --set "operator.image.tag=${version}" \
            --set "defaults.image.repository=ghcr.io/${{ github.repository }}" \
            --set "defaults.image.tag=${version}" \
            --wait \
            --timeout 5m
          kubectl rollout status \
            deployment/streamforge-streamforge-operator \
            --namespace streamforge-system \
            --timeout 2m
          helm uninstall streamforge --namespace streamforge-system
          kubectl delete namespace streamforge-system --wait=true

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          printf '%s' "${GH_TOKEN}" |
            helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || github.token }}

      - name: Publish chart
        run: helm push release-chart/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-chart/*.tgz

      - name: Upload chart assets
        shell: bash
        run: gh release upload "${RELEASE_TAG}" release-chart/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  release-complete:
    name: Verify mandatory release jobs
    needs:
      - validate-release
      - publish-crate
      - publish-binary-assets
      - publish-engine-image
      - publish-component-images
      - publish-helm-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in for private-package smoke tests
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Run published-image quickstart
        shell: bash
        env:
          STREAMFORGE_CONTAINER_RUNTIME: docker
          STREAMFORGE_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate-release.outputs.version }}
          STREAMFORGE_QUICKSTART_VERIFY_ATTEMPTS: 30
        run: |
          set -euo pipefail
          trap 'scripts/quickstart.sh down' EXIT
          scripts/quickstart.sh up
          scripts/quickstart.sh verify

      - run: echo "All mandatory release artifacts and smoke tests completed successfully."
