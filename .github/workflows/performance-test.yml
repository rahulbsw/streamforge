---
name: Performance Smoke Tests

# Manual, on-demand evidence only. Shared GitHub-hosted runners are noisy, so
# these measurements are not a performance regression gate.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      messages:
        description: Number of messages for the throughput smoke run
        required: false
        default: "100000"
        type: string
      partitions:
        description: Number of Kafka partitions
        required: false
        default: "8"
        type: string
      threads:
        description: Number of Streamforge worker threads
        required: false
        default: "8"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  criterion-smoke:
    name: Criterion smoke evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libsasl2-dev \
            libssl-dev \
            libzstd-dev \
            pkg-config

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Prepare structured result directories
        run: mkdir -p target/performance-results/criterion

      - name: Verify checked-in WASM benchmark fixtures
        working-directory: tests/fixtures/wasm/generated
        run: shasum -a 256 -c SHA256SUMS

      - name: Run all Criterion targets
        run: |
          FILTER_LOG=target/performance-results/criterion/filter_benchmarks.log
          TRANSFORM_LOG=target/performance-results/criterion/transform_benchmarks.log
          PIPELINE_LOG=target/performance-results/criterion/end_to_end_benchmark.log
          WASM_LOG=target/performance-results/criterion/wasm_udf_benchmarks.log
          cargo bench --bench filter_benchmarks -- --noplot \
            2>&1 | tee "$FILTER_LOG"
          cargo bench --bench transform_benchmarks -- --noplot \
            2>&1 | tee "$TRANSFORM_LOG"
          cargo bench --bench end_to_end_benchmark -- --noplot \
            2>&1 | tee "$PIPELINE_LOG"
          cargo bench --bench wasm_udf_benchmarks -- --noplot \
            2>&1 | tee "$WASM_LOG"

      - name: Explain evidence scope
        if: always()
        run: |
          {
            echo "## Criterion smoke evidence"
            echo
            echo "All four repository Criterion targets were executed" \
              "on a shared GitHub-hosted runner."
            echo "Results are diagnostic smoke evidence only;" \
              "this workflow applies no regression threshold."
            echo
            echo "The stable wasm_udf/native_no_udf control preserves the" \
              "JSON-bytes-to-one-destination-envelope workload."
            echo "The <=3% native no-UDF release budget requires statistically" \
              "significant matched A/B runs on controlled native hardware;" \
              "shared-runner results must not be used as that gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Criterion reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/criterion/
            target/performance-results/criterion/
            tests/fixtures/wasm/generated/SHA256SUMS

  throughput-smoke:
    name: Throughput smoke evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native and harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            libclang-dev \
            libsasl2-dev \
            libssl-dev \
            libzstd-dev \
            pkg-config

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Start benchmark Kafka
        run: docker compose -f docker-compose.benchmark.yml up -d --wait

      - name: Prepare structured result directory
        run: mkdir -p target/performance-results/throughput

      - name: Run one throughput repetition
        env:
          SMOKE_MESSAGES: ${{ inputs.messages }}
          SMOKE_PARTITIONS: ${{ inputs.partitions }}
          SMOKE_THREADS: ${{ inputs.threads }}
        run: |
          scripts/benchmarks/run_throughput_test.sh \
            "$SMOKE_MESSAGES" \
            "$SMOKE_PARTITIONS" \
            "$SMOKE_THREADS" \
            1 \
            2>&1 | tee target/performance-results/throughput/harness.log

      - name: Collect structured throughput evidence
        if: always()
        env:
          SMOKE_MESSAGES: ${{ inputs.messages }}
          SMOKE_PARTITIONS: ${{ inputs.partitions }}
          SMOKE_THREADS: ${{ inputs.threads }}
        run: |
          mkdir -p \
            target/performance-results/throughput/docker

          COMPOSE_LOG=target/performance-results/throughput/docker/compose.log
          docker compose -f docker-compose.benchmark.yml logs --no-color \
            > "$COMPOSE_LOG" 2>&1 || true

          {
            echo "## Throughput smoke evidence"
            echo
            echo "- Messages: $SMOKE_MESSAGES"
            echo "- Partitions: $SMOKE_PARTITIONS"
            echo "- Threads: $SMOKE_THREADS"
            echo "- Repetitions: 1"
            echo "- Environment: shared GitHub-hosted runner"
            echo
            echo "This is diagnostic smoke evidence, not a regression gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload structured throughput results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: throughput-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: target/performance-results/throughput/

      - name: Stop Streamforge and Kafka
        if: always()
        run: docker compose -f docker-compose.benchmark.yml down -v
