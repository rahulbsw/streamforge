apiVersion: streamforge.io/v1alpha1
kind: StreamforgePipeline
metadata:
  name: secure-transform
  namespace: default
spec:
  appid: secure-transform

  # Source with SSL/SASL
  source:
    brokers: "kafka-source.example.com:9093"
    topic: "raw-events"
    offset: "latest"
    security:
      protocol: "SASL_SSL"
      ssl:
        caSecret:
          name: source-kafka-ca
          key: ca.crt
      sasl:
        mechanism: "SCRAM-SHA-256"
        usernameSecret:
          name: source-kafka-auth
          key: username
        passwordSecret:
          name: source-kafka-auth
          key: password

  # Destination with transformation
  destinations:
    - brokers: "kafka-target.example.com:9093"
      topic: "transformed-events"

      # Transform: Extract fields and construct new object
      transform: "CONSTRUCT:userId=/user/id:userEmail=/user/email:eventType=/event/type:timestamp=/timestamp"

      # Only process active users
      filter: "/user/active,==,true"

      # Custom partitioning by userId
      partitioner: "field"
      partitionerField: "/user/id"

      security:
        protocol: "SASL_SSL"
        ssl:
          caSecret:
            name: target-kafka-ca
            key: ca.crt
        sasl:
          mechanism: "SCRAM-SHA-256"
          usernameSecret:
            name: target-kafka-auth
            key: username
          passwordSecret:
            name: target-kafka-auth
            key: password

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"

  replicas: 4
  threads: 8
  logLevel: "info"
