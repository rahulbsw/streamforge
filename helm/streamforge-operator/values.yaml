# Streamforge Operator Configuration

# Operator deployment settings
operator:
  image:
    repository: ghcr.io/rahulbsw/streamforge-operator
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Service account for the operator
  serviceAccount:
    create: true
    name: streamforge-operator
    annotations: {}

  # RBAC settings
  rbac:
    create: true

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Environment variables
  env:
    - name: RUST_LOG
      value: info
    - name: RECONCILE_INTERVAL
      value: "30"

# Default settings for StreamforgePipeline resources
defaults:
  image:
    repository: ghcr.io/rahulbsw/streamforge
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  replicas: 1
  threads: 4
  logLevel: info

  # ServiceAccount for pipeline pods
  serviceAccount:
    create: true
    name: streamforge-pipeline
    annotations: {}

# Monitoring settings
monitoring:
  enabled: false

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  prometheusRule:
    labels: {}

  # Grafana dashboard
  grafanaDashboard:
    enabled: false
    namespace: monitoring

# UI Configuration (optional web interface)
ui:
  # Enable UI deployment
  enabled: false

  image:
    repository: ghcr.io/rahulbsw/streamforge-ui
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Service configuration
  service:
    type: ClusterIP
    port: 3001
    nodePort: null

  # UI authentication. Production installations must reference a Secret that
  # already exists. Set developmentMode only for disposable local clusters; in
  # that mode the chart creates and retains a random JWT secret.
  auth:
    existingSecret: ""
    secretKey: jwt-secret
    usersKey: users.json
    demoAdminPasswordKey: demo-admin-password
    demoViewerPasswordKey: demo-viewer-password
    developmentMode: false

  # Service account
  serviceAccount:
    create: true
    name: streamforge-ui
    annotations: {}

  # RBAC settings
  rbac:
    create: true

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  # Ingress configuration (optional)
  ingress:
    enabled: false
    className: nginx
    annotations: {}
      # nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: streamforge.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Environment variables
  env:
    - name: PORT
      value: "3001"
