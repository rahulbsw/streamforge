apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamforge-operator.fullname" . }}
  labels:
    {{- include "streamforge-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "streamforge-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamforge-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "streamforge-operator.serviceAccountName" . }}
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ include "streamforge-operator.imageTag" (list .Values.operator.image.tag .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          {{- with .Values.operator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range .Values.operator.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEFAULT_IMAGE_REPOSITORY
              value: {{ .Values.defaults.image.repository }}
            - name: DEFAULT_IMAGE_TAG
              value: {{ include "streamforge-operator.imageTag" (list .Values.defaults.image.tag .Chart.AppVersion) }}
            - name: DEFAULT_IMAGE_PULL_POLICY
              value: {{ .Values.defaults.image.pullPolicy }}
            - name: DEFAULT_SERVICE_ACCOUNT
              value: {{ include "streamforge-operator.pipelineServiceAccountName" . }}
            - name: DEFAULT_REPLICAS
              value: {{ .Values.defaults.replicas | quote }}
            - name: DEFAULT_THREADS
              value: {{ .Values.defaults.threads | quote }}
            - name: DEFAULT_LOG_LEVEL
              value: {{ .Values.defaults.logLevel | quote }}
            - name: DEFAULT_REQUEST_CPU
              value: {{ .Values.defaults.resources.requests.cpu | quote }}
            - name: DEFAULT_REQUEST_MEMORY
              value: {{ .Values.defaults.resources.requests.memory | quote }}
            - name: DEFAULT_LIMIT_CPU
              value: {{ .Values.defaults.resources.limits.cpu | quote }}
            - name: DEFAULT_LIMIT_MEMORY
              value: {{ .Values.defaults.resources.limits.memory | quote }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
