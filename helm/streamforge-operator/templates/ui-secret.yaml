{{- if and .Values.ui.enabled (not .Values.ui.auth.existingSecret) }}
{{- if not .Values.ui.auth.developmentMode }}
{{- fail "ui.auth.existingSecret is required when ui.enabled=true unless ui.auth.developmentMode=true" }}
{{- end }}
{{- $secretName := include "streamforge-operator.uiSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "streamforge-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.ui.auth.secretKey }}: {{ if and $existing (index $existing.data .Values.ui.auth.secretKey) }}{{ index $existing.data .Values.ui.auth.secretKey | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | quote }}{{ end }}
  {{ .Values.ui.auth.demoAdminPasswordKey }}: {{ if and $existing (index $existing.data .Values.ui.auth.demoAdminPasswordKey) }}{{ index $existing.data .Values.ui.auth.demoAdminPasswordKey | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  {{ .Values.ui.auth.demoViewerPasswordKey }}: {{ if and $existing (index $existing.data .Values.ui.auth.demoViewerPasswordKey) }}{{ index $existing.data .Values.ui.auth.demoViewerPasswordKey | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
{{- end }}
