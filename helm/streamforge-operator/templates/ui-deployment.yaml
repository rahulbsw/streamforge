{{- if .Values.ui.enabled }}
{{- if and .Values.ui.auth.developmentMode .Values.ui.auth.existingSecret }}
{{- fail "ui.auth.developmentMode cannot be combined with ui.auth.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamforge-operator.fullname" . }}-ui
  labels:
    {{- include "streamforge-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "streamforge-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "streamforge-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- if .Values.ui.serviceAccount.create }}
      serviceAccountName: {{ .Values.ui.serviceAccount.name }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ include "streamforge-operator.imageTag" (list .Values.ui.image.tag .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ ternary "development" "production" .Values.ui.auth.developmentMode | quote }}
            {{- range .Values.ui.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamforge-operator.uiSecretName" . }}
                  key: {{ .Values.ui.auth.secretKey }}
            {{- if .Values.ui.auth.developmentMode }}
            - name: STREAMFORGE_DEMO_AUTH
              value: "true"
            - name: STREAMFORGE_DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamforge-operator.uiSecretName" . }}
                  key: {{ .Values.ui.auth.demoAdminPasswordKey }}
            - name: STREAMFORGE_DEMO_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamforge-operator.uiSecretName" . }}
                  key: {{ .Values.ui.auth.demoViewerPasswordKey }}
            {{- else }}
            - name: STREAMFORGE_UI_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamforge-operator.uiSecretName" . }}
                  key: {{ .Values.ui.auth.usersKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
